<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TravelBloom - Travel Recommendation</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="travel_recommendation.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo-section">
            <i class="fa-solid fa-plane-departure"></i>
            <span>TravelBloom</span>
        </div>
        <div class="nav-links">
            <a href="travel_recommendation.html" class="active">Home</a>
            <a href="about.html">About Us</a>
            <a href="contact.html">Contact Us</a>
        </div>
        <div class="search-container">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass search-icon"></i>
                <input type="text" id="searchInput" placeholder="Enter a destination or keyword">
            </div>
            <button type="button" id="btnSearch">Search</button>
            <button type="button" id="btnClear">Clear</button>
        </div>
    </nav>

    <aside class="social-sidebar">
        <a href="#"><i class="fa-brands fa-x-twitter"></i></a>
        <a href="#"><i class="fa-brands fa-facebook-f"></i></a>
        <a href="#"><i class="fa-brands fa-instagram"></i></a>
        <a href="#"><i class="fa-brands fa-youtube"></i></a>
    </aside>

    <main class="main-container">
        <section class="hero-section">
            <h1>EXPLORE<br>DREAM<br>DESTINATION</h1>
            <p>It encourages exploration of unfamiliar territories, embracing diverse cultures, landscapes, and breathtaking beaches across the globe.</p>
            <a href="#" class="btn-book">BOOK NOW</a>
        </section>

        <section id="resultsContainer" class="results-container"></section>
    </main>

    <script src="travel_recommendation.js"></script>
</body>
</html>
